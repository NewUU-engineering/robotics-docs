# Built on the NewUU documentation template:
#   https://github.com/NewUU-engineering/newuu-docs-template
#
# The theme below is the template's and should not be edited here — a change
# made in one repository does not reach the others. Open an issue against the
# template instead, so the fix lands everywhere. The reasoning behind each
# choice is in docs/stylesheets/newuu.css and in the template's
# DESIGN-DECISIONS.md.

site_name: Robotics Docs
site_description: Operations and development documentation for the robotics platforms of the NewUU Engineering School
site_url: 'https://newuu-engineering.github.io/robotics-docs/'
repo_name: 'NewUU-engineering'
repo_url: 'https://github.com/NewUU-engineering/robotics-docs'
edit_uri: edit/main/docs/
copyright: CC BY 4.0 · School of Engineering, New Uzbekistan University

theme:
  name: material
  custom_dir: overrides   # footer lockup; see overrides/partials/copyright.html
  language: en
  # No `logo:` on purpose. Material always wraps the logo in a home LINK, and
  # the brand rule should be a mark, not a button. It is drawn instead as a
  # ::before on the header title (newuu.css §12.11), which is decoration only
  # and is present at every breakpoint.
  favicon: assets/favicon.svg
  font:
    text: IBM Plex Sans      # full Cyrillic + Latin Extended (Uzbek o', g', ʻ)
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    # ONE icon toggles the scheme — not a light/dark pair of buttons
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch theme
    - media: "(prefers-color-scheme: light)"
      scheme: newuu
      toggle:
        icon: material/brightness-7
        name: Switch theme
    - media: "(prefers-color-scheme: dark)"
      scheme: newuu-dark
      toggle:
        icon: material/brightness-4
        name: Switch theme
  features:
    - navigation.sections    # flattens the drawer: no sliding sub-levels
    - navigation.tracking
    - navigation.top
    - navigation.footer      # previous / next at the foot of the page
    - navigation.indexes
    - navigation.path        # breadcrumbs
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.tooltips
    - search.suggest
    - search.highlight
    # navigation.instant is deliberately OFF: it breaks the i18n language
    # switcher, which then sends readers to the home page instead of the
    # same page in the other language.

extra_css:
  - stylesheets/newuu.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # Kept from the pre-template configuration: changing the slugifier would
      # change every heading anchor and break links already shared with students.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  # ++l2+b++ -> real keyboard keys.
  #
  # IMPORTANT: pymdownx.keys only renders names it knows. Keyboard keys are in
  # its default map; GAMEPAD AND CONTROLLER BUTTONS ARE NOT. Without the map
  # below, `++l2+b++` is published verbatim as the literal text "++l2+b++" —
  # and it is normally written on a safety callout, which is the worst place in
  # the documentation to be wrong.
  - pymdownx.keys:
      key_map:
        l1: "L1"
        l2: "L2"
        r1: "R1"
        r2: "R2"
        start: "START"
        select: "SELECT"
        home: "HOME"
        dpad-up: "D-pad ↑"
        dpad-down: "D-pad ↓"
        dpad-left: "D-pad ←"
        dpad-right: "D-pad →"
        stick-left: "Left stick"
        stick-right: "Right stick"
  - pymdownx.tabbed:
      alternate_style: true # content.tabs.link does nothing without this
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs/includes]   # --8<-- "file.md" pulls from here
  - pymdownx.tasklist:
      custom_checkbox: true
  # Required for :material-*: icons in card grids. Without it the shortcodes
  # render as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          site_name: Robotics Docs
          site_description: Документация по эксплуатации и разработке для робототехнических платформ Инженерной школы NewUU
          nav_translations:
            Introduction: Введение
            Unitree G1 EDU: Unitree G1 EDU
            Overview: Обзор
            Safety: Техника безопасности
            Controls reference: Справочник по управлению
            Workspace preparation: Подготовка рабочего места
            Standard operating procedures: Штатные процедуры
            Working on the gantry: Работа с кронштейном
            Mobile application: Мобильное приложение
            Calibration: Калибровка
            Development: Разработка
            Maintenance: Обслуживание
            Troubleshooting: Устранение неисправностей
            Training plan: Учебный план
            References: Источники

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NewUU-engineering

# docs/includes/ holds snippet fragments pulled in with --8<--. They are not
# pages, so keep them out of the build and out of the "not in nav" warning.
exclude_docs: |
  includes/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Introduction: "index.md"
  - Unitree G1 EDU:
    - Overview: "g1/index.md"
    - Safety: "g1/safety.md"
    - Controls reference: "g1/controls.md"
    - Workspace preparation: "g1/workspace.md"
    - Standard operating procedures: "g1/operation.md"
    - Working on the gantry: "g1/gantry.md"
    - Mobile application: "g1/mobile-app.md"
    - Calibration: "g1/calibration.md"
    - Development: "g1/development.md"
    - Maintenance: "g1/maintenance.md"
    - Troubleshooting: "g1/troubleshooting.md"
    - Training plan: "g1/training-plan.md"
    - References: "g1/references.md"
